<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }

    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: linear-gradient(135deg, #12295a, #0d1f45);
    border-radius: 0 0 12px 12px;
    border-top: 3px solid #d92b34;
  }
  .bar svg { width: 12px; height: 12px; }
</style>
</head>
<body>
<div class="bar">

  <svg viewBox="0 0 24 24"><path fill="#f2b632" d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.5 5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg>
  <svg viewBox="0 0 24 24"><path fill="#3aa63f" d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.5 5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg>
</div>
</body>
</html>
