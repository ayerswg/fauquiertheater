<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
  .bar {
    position: absolute; inset: 0 0 -2px 0;
    display: flex; align-items: center;
    padding: 0 16px;
    border: 2px solid #12295a;
    border-bottom: 0;
    border-radius: 12px 12px 0 0;
  }
  .badge {
    display: inline-block;
    font-family: Roboto, Arial, sans-serif; font-weight: 800; font-size: 11.5px;
    letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
    color: #0d1f45; background: #f2b632;
    border-radius: 999px; padding: 6px 12px; white-space: nowrap;
  }
</style>
</head>
<body>
<div class="bar">
  <span class="badge">Next Main Stage Show</span>
</div>
</body>
</html>
